# Valores são placeholders ${VAR}: a pipeline de deploy (.github/workflows/ci.yml)
# os substitui via envsubst a partir de GitHub Secrets antes do kubectl apply.
# Nenhum segredo real é commitado. Ver README.md > CI/CD.
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=payments_db;Username=payments_user;Password=${PAYMENTS_DB_PASSWORD}"
  JwtSettings__Secret: "${JWT_SECRET}"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
